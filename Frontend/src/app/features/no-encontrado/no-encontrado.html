<app-page-hero variant="breadcrumb" title="No se encontró lo que buscas" [subtitle]="subtitle()">
  <app-breadcrumbs [items]="crumbs" />
  <p class="nf-code">404</p>
</app-page-hero>

<section class="nf-page">
  <div class="nf-wrap">
    @if (desdeDocumento()) {
      <p>El enlace corresponde a un PDF oficial que todavía no se ha publicado en el portal.</p>
    } @else {
      <p>Comprueba la dirección o vuelve al inicio para continuar la navegación.</p>
    }
    <div class="nf-actions">
      <a appButton variant="outline" routerLink="/transparencia">Volver a transparencia</a>
      <a appButton routerLink="/inicio">Ir al inicio</a>
    </div>
  </div>
</section>
