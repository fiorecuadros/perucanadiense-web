<div class="admin-shell" [class.nav-open]="navAbierto()">
  <app-toast-host />
  <app-admin-sidebar></app-admin-sidebar>
  <button
    type="button"
    class="admin-scrim"
    aria-label="Cerrar el menú"
    (click)="navAbierto.set(false)"
  ></button>
  <div class="admin-body">
    <header class="admin-topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="admin-burger"
          [attr.aria-expanded]="navAbierto()"
          [attr.aria-label]="
            colapsado() ? 'Expandir el menú de secciones' : 'Contraer el menú de secciones'
          "
          (click)="alternarNav()"
        >
          <i class="fa fa-bars" aria-hidden="true"></i>
        </button>
        <span class="topbar-heads">
          <h2 class="topbar-title">{{ pageTitle() }}</h2>
          <span class="topbar-date">{{ hoy }}</span>
        </span>
      </div>

      <div class="usermenu">
        <button
          type="button"
          class="usermenu-trigger"
          [class.is-open]="menuAbierto()"
          (click)="alternarMenu()"
          [attr.aria-expanded]="menuAbierto()"
          aria-haspopup="menu"
        >
          <span class="topbar-avatar" aria-hidden="true">{{ iniciales() }}</span>
          <span class="usermenu-id">
            <span class="usermenu-name">{{ usuario()?.nombre ?? 'Sesión' }}</span>
            <span class="usermenu-role">{{ rolEtiqueta() }}</span>
          </span>
          <i class="fa fa-chevron-down usermenu-caret" aria-hidden="true"></i>
        </button>

        @if (menuAbierto()) {
          <div class="usermenu-pop" role="menu">
            <div class="usermenu-pop-head">
              <span class="usermenu-name">{{ usuario()?.nombre ?? 'Sesión' }}</span>
              <span class="usermenu-role">{{ rolEtiqueta() }}</span>
            </div>
            <a routerLink="/admin/mi-cuenta" class="usermenu-item" role="menuitem">
              <i class="fa fa-user-gear" aria-hidden="true"></i> Mi cuenta
            </a>
            <button
              type="button"
              class="usermenu-item usermenu-item--danger"
              role="menuitem"
              (click)="cerrarSesion()"
            >
              <i class="fa fa-right-from-bracket" aria-hidden="true"></i> Cerrar sesión
            </button>
          </div>
        }
      </div>
    </header>
    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
